<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d1f3f">
  <title>Robo Cross</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026102729">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- every release bumps ?v= so Telegram's webview never runs stale game files -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "./js/audio.js": "./js/audio.js?v=2026102729",
      "./js/backdrop.js": "./js/backdrop.js?v=2026102729",
      "./js/env.js": "./js/env.js?v=2026102729",
      "./js/game.js": "./js/game.js?v=2026102729",
      "./js/garage.js": "./js/garage.js?v=2026102729",
      "./js/leaderboard.js": "./js/leaderboard.js?v=2026102729",
      "./js/minigame.js": "./js/minigame.js?v=2026102729",
      "./js/models.js": "./js/models.js?v=2026102729",
      "./js/npc.js": "./js/npc.js?v=2026102729",
      "./js/telegram.js": "./js/telegram.js?v=2026102729",
      "./js/textures.js": "./js/textures.js?v=2026102729"
    }
  }
  </script>
</head>
<body>
  <!-- the game always runs in a phone-shaped frame (full screen on phones) -->
  <div id="app">
  <div id="game"></div>
  <div id="warns"></div>
  <div id="danger"></div>

  <div id="hud">
    <div id="score">0</div>
    <div id="best">РЕКОРД 0</div>
    <div id="coins"><span class="coin-ico"></span><span id="coin-count">0</span></div>
    <button id="mute" aria-label="Звук"></button>
    <button id="music" aria-label="Музыка"></button>
    <button id="pausebtn" aria-label="Пауза"></button>
    <!-- ability buttons, a column at the bottom right (more abilities go on top) -->
    <div id="abilities">
      <button id="shieldbtn" class="ability shield hidden" aria-label="Щит"><span></span></button>
      <button id="jetbtn" class="ability hidden" aria-label="Джетпак"><span></span></button>
    </div>
    <div id="toast"></div>
  </div>

  <!-- main menu: the robot waits on the neon street -->
  <div id="menu" class="screen">
    <h1 class="logo"><span>ROBO</span><span class="y">CROSS</span></h1>
    <div class="menu-bottom">
      <button id="btn-garage" class="side"><i class="ico garage"></i><span>ГАРАЖ</span></button>
      <button id="play" class="play">ИГРАТЬ</button>
      <button id="btn-leaders" class="side"><i class="ico cup"></i><span>ЛИДЕРЫ</span></button>
    </div>
  </div>

  <!-- garage: the robot up top, the shop below -->
  <div id="garage" class="screen hidden">
    <div class="g-top">
      <button id="garage-close" class="back" aria-label="Назад"></button>
      <span class="g-title">ГАРАЖ</span>
      <span class="pill"><i class="coin-ico"></i><b id="garage-coins">0</b></span>
    </div>
    <div class="sheet shop">
      <div id="garage-tabs" class="tabs"></div>
      <div id="garage-hint" class="g-hint hidden"></div>
      <div id="garage-items" class="items"></div>
      <button id="garage-buy" class="buy hidden">КУПИТЬ</button>
    </div>
  </div>

  <div id="leaders" class="screen hidden">
    <div class="sheet tall">
      <div class="sheet-head">
        <span>ЛИДЕРЫ</span>
        <button id="leaders-close" class="x" aria-label="Закрыть">✕</button>
      </div>
      <div id="leaders-list" class="list"></div>
      <div id="leaders-me" class="me"></div>
    </div>
  </div>

  <div id="over" class="screen hidden">
    <div class="panel">
      <h2>СИСТЕМА<br>ОТКЛЮЧЕНА</h2>
      <div id="reason"></div>
      <div class="row"><span>СЧЁТ</span><b id="final-score">0</b></div>
      <div class="row"><span>РЕКОРД</span><b id="final-best">0</b></div>
      <div id="new-best" class="new hidden">★ НОВЫЙ РЕКОРД ★</div>
      <div id="over-board" class="board hidden"></div>
      <button id="restart">ЕЩЁ РАЗ</button>
      <button id="tomenu" class="ghost">В МЕНЮ</button>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="panel">
      <h2 id="pause-title">ПАУЗА</h2>
      <button id="resume" class="big">ПРОДОЛЖИТЬ</button>
      <button id="newrun" class="ghost">НОВАЯ ИГРА</button>
    </div>
  </div>

  <div id="loading">
    <div class="ld-grid"></div>
    <div class="ld-center">
      <div class="ld-ring"><img src="assets/rr.svg" alt="RR"></div>
      <img class="ld-word" src="assets/logo-white.svg" alt="RENT ROBOT">
      <div class="ld-title"><span>ROBO</span> <span class="y">CROSS</span></div>
    </div>
    <div class="ld-bottom">
      <div class="ld-bar"><i id="ld-fill"></i></div>
      <div id="ld-text">ЗАГРУЗКА...</div>
      <div id="ld-tip"></div>
    </div>
  </div>
  </div>

  <script type="module" src="js/game.js?v=2026102729"></script>
</body>
</html>
